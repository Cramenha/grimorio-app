<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grimório do Aventureiro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link href="vendor/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/@fontsource/cinzel/400.css" rel="stylesheet">
  <link href="vendor/@fontsource/cinzel/700.css" rel="stylesheet">
  <link href="vendor/@fontsource/signika/400.css" rel="stylesheet">
  <link href="vendor/@fontsource/signika/500.css" rel="stylesheet">
  <link href="vendor/@fontsource/signika/600.css" rel="stylesheet">
  <link href="vendor/@fontsource/signika/700.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="tema.js"></script>
</head>
<body>
  <nav id="topo">
    <div class="container-xl d-flex align-items-center gap-3 py-2 flex-wrap">
      <div class="marca" id="marca" title="Voltar aos personagens">🎲 Grimório do Aventureiro<small>FICHAS · ANOTAÇÕES · COMPÊNDIO 4E</small></div>
      <div class="position-relative flex-grow-1" style="max-width:480px">
        <input id="busca-global" class="form-control form-control-sm" placeholder="Pesquisar no compêndio (poder, talento, item, raça…)" autocomplete="off">
        <div id="res-global" class="invisivel"></div>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button id="btn-atualizar" class="btn-rpg-sec btn-sm btn-discreto" title="Verificar atualizações / Check for updates">↻</button>
        <button id="btn-idioma" class="btn-rpg-sec btn-sm" title="Idioma dos textos do compêndio (o nome sempre mostra o original e a tradução)">🌐 Português</button>
        <button id="btn-tema" class="btn-rpg-sec btn-sm"></button>
        <button id="btn-manual" class="btn-rpg-sec btn-sm" title="Manual do usuário, numa janela própria">📖 Manual</button>
        <button id="btn-config" class="btn-rpg-sec btn-sm">⚙ Configurar</button>
      </div>
    </div>
  </nav>

  <main class="container-xl py-4" id="principal"></main>
  <div id="janelas"></div>
  <div id="toasts"></div>

  <!-- Seletor do compêndio -->
  <div class="modal fade" id="modalPicker" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content folha">
        <div class="d-flex align-items-center gap-2 mb-2"><h3 id="pk-titulo" class="mb-0 flex-grow-1"></h3><button class="btn-rpg-mini" data-bs-dismiss="modal">Fechar ✕</button></div>
        <div id="pk-filtros" class="row g-2 mb-2"></div>
        <div class="row g-3">
          <div class="col-lg-6"><div id="pk-lista" style="max-height:52vh;overflow:auto"></div><div id="pk-rodape" class="rotulo mt-1"></div></div>
          <div class="col-lg-6"><div id="pk-previa" style="max-height:52vh;overflow:auto"></div><div class="mt-2 text-end" id="pk-acoes"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leitor do compêndio -->
  <div class="modal fade" id="modalLeitor" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content folha">
        <div class="text-end mb-2"><button class="btn-rpg-mini" data-bs-dismiss="modal">Fechar ✕</button></div>
        <div id="leitor"></div>
      </div>
    </div>
  </div>

  <!-- Grimório de poderes -->
  <div class="modal fade" id="grimorio" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="barra">
          <h3>📖 Grimório de Poderes</h3>
          <span id="gr-nome" class="titulo" style="color:var(--md-on-surface-variant)"></span>
          <div id="gr-filtros" class="d-flex gap-1 flex-wrap"></div>
          <div class="ms-auto d-flex gap-2 align-items-center">
            <div class="gr-zoom" title="Zoom dos cartões (Ctrl + roda do mouse também funciona)"><button class="btn-rpg-mini" id="gr-zm" title="Diminuir">A−</button><button class="btn-rpg-mini" id="gr-z0" title="Voltar a 100%"><span id="gr-zv">100%</span></button><button class="btn-rpg-mini" id="gr-zp" title="Aumentar">A+</button></div>
            <button class="btn-rpg-sec btn-sm" id="gr-janela" title="Abre o grimório numa janela separada, para você posicionar e dar zoom como quiser">↗ Janela separada</button>
            <button class="btn-rpg-sec btn-sm invisivel" id="gr-atualizar" title="Recarrega a ficha (use depois de mudar poderes ou itens)">↻ Atualizar</button>
            <button class="btn-rpg-sec btn-sm" id="gr-modo">Texto: Português</button>
            <button class="btn-rpg-mini" data-bs-dismiss="modal">Fechar ✕</button>
          </div>
        </div>
        <div id="gr-corpo"></div>
      </div>
    </div>
  </div>

  <!-- Configurações -->
  <div class="modal fade" id="modalConfig" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content folha">
        <div class="d-flex align-items-center mb-2"><h3 class="mb-0 flex-grow-1">⚙ Configurações</h3><button class="btn-rpg-mini" data-bs-dismiss="modal">Fechar ✕</button></div>
        <div id="cfg-corpo"></div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="criatura.js"></script>
  <!-- reticle:connect (dev only, written by reticle init) -->
  <!-- Só conecta se o servidor entregar reticle.local.js: ele é gitignored, fica fora dos pacotes e o server.js
       não o serve dentro do Electron (que também roda em localhost). Sem o arquivo, nada é baixado. -->
  <script type="module">
    import('./reticle.local.js').then(async (local) => {
      if (!local.token) return;
      const { reticle, registerStore } = await import('https://cdn.jsdelivr.net/npm/@reticlehq/browser@3.7.0/+esm');
      reticle.connect({ projectId: 'fichas-rpg-f19531b4', token: local.token });
      // estado do app (globais de app.js) para reticle_look { action: "state", store: "grimorio" }
      registerStore('grimorio', () => ({
        aba, idioma: IDIOMA, tema: temaAtual(),
        personagem: P && { id: P.id, nome: P.nome, tipo: P.tipo || 'personagem', nivel: P.nivel, classe: P.classe?.nome, raca: P.raca?.nome, plataforma: P.plataforma },
        calculo: CALC && { ca: CALC.ac, fort: CALC.fort, ref: CALC.ref, vont: CALC.vont, pv: CALC.pv, iniciativa: CALC.iniciativa, avisos: CALC.avisos?.length },
        ficha: P,
      }));
    }).catch(() => {});
  </script>
  <!-- /reticle:connect -->
</body>
</html>
